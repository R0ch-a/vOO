# ============================================================
#  vOO Airline — application.properties
# ============================================================

# ---------- Server ----------
server.port=8080
server.servlet.context-path=/

# ---------- DataSource (PostgreSQL) ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/voo_airline
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexões (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- Flyway (Migrations) ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---------- Jackson ----------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=America/Sao_Paulo

# ---------- Logging ----------
logging.level.com.voo=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# ---------- SpringDoc / Swagger ----------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.info.title=vOO Airline API
springdoc.info.description=API REST do simulador da companhia aérea vOO
springdoc.info.version=1.0.0

# ---------- CORS ----------
voo.cors.allowed-origins=http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500
